name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the formula
        run: brew install --formula ./Formula/fenestra.rb

      - name: Run the binary
        run: |
          fenestra --version
          fenestra --browsers | head -5

      - name: Homebrew test block
        run: brew test fenestra
